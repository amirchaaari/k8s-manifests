apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wso2-notifier
  namespace: application
spec:
  ingressClassName: nginx
  # TLS termination for the dashboard. Uses a self-signed cert in the "notifier-tls"
  # secret (created out-of-band with kubectl, NOT in git). Browser warns until the
  # cert is trusted; traffic is encrypted. HTTP now auto-redirects to HTTPS.
  tls:
    - hosts:
        - notifier.wso2.com
      secretName: notifier-tls
  rules:
  - host: notifier.wso2.com
    http:
      paths:
      # API calls go straight to the Spring Boot backend (keeps the /api prefix).
      # This bypasses the frontend image's baked-in nginx proxy (which points at
      # the wrong namespace), so no frontend image rebuild is required.
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: wso2-notifier-backend
            port:
              number: 8080
      # Everything else serves the React SPA.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wso2-notifier-frontend
            port:
              number: 80
